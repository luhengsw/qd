name: Build Pycurl Base Image
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'Dockerfile.pycurl'
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Pycurl Base Image job
    if: startsWith(github.repository, 'luhengsw/qd')

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push pycurl base image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.pycurl
        platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7
        push: true
        tags: ghcr.io/luhengsw/pycurl:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
